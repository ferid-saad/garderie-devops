services:
  backend:
    image: feridsaad/garderie-backend:latest
    container_name: garderie-backend
    restart: unless-stopped
    environment:
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - garderie-net

  frontend:
    image: feridsaad/garderie-frontend:latest
    container_name: garderie-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - garderie-net

networks:
  garderie-net:
    driver: bridge